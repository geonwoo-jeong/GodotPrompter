name: Validate

# The checks release.yml runs on a tag, run on every PR and every push to master.
# release.yml is tag-triggered, so before this workflow the only check on a PR was the
# plugin scan: a broken validator rule or a failing hook test reached a reviewer with
# nothing to show it, and surfaced only when someone cut a release.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills and hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false

      # No install step: the scripts and tests are stdlib-only. The tokenizers in
      # optionalDependencies are needed by count-tokens.mjs alone, which does not run here.

      - name: Run skill validator
        run: node scripts/validate-skills.mjs

      # `npm test` rather than the individual suites on purpose: it chains whatever this
      # branch defines, so a suite added to package.json is covered here without editing
      # this file. Today that is test:hooks and test:validator.
      - name: Run test suites
        run: npm test

      # Self-test: the fixtures under scripts/fixtures/ are deliberately broken (over budget,
      # bad frontmatter, broken cross-ref). If the validator ever stops catching them, its rules
      # have been silently disabled — fail loudly rather than report a green PR that isn't checked.
      - name: Validator self-test (fixtures must fail)
        run: |
          if node scripts/validate-skills.mjs --include-fixtures; then
            echo "::error::Validator passed on the broken fixtures — its rules are not being enforced."
            exit 1
          fi
          echo "Validator correctly rejected the fixtures."

  examples:
    name: Execute Markdown examples (Godot 4.7.2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_linux.x86_64
      GDUNIT4_PATH: ${{ github.workspace }}/.test-deps/gdunit4/addons/gdUnit4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.401'

      - name: Install official Godot 4.7.2 binary
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot.zip"
          printf '%s  %s\n' 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4' "$RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version

      - name: Check out gdUnit4 6.2.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: godot-gdunit-labs/gdUnit4
          ref: 08ffc7c65b61b1b2edd545616061a99973c13ce1 # v6.2.1
          path: .test-deps/gdunit4
          persist-credentials: false

      - name: Run GDScript behavioral regressions
        run: npm run test:examples
      - name: Verify documented gdUnit4 CLI commands
        run: npm run test:gdunit-cli
      - name: Compile documented C# examples with the official SDK
        run: npm run test:csharp -- --work-dir "$RUNNER_TEMP/csharp-validation"
